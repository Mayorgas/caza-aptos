name: Actualizar avisos

on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 a. m. hora de Bogotá
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Traer avisos de Fincaraíz
        run: python scraper/fincaraiz.py
      - name: Guardar cambios
        run: |
          git config user.name "caza-aptos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/listings.json
          git diff --cached --quiet || git commit -m "Actualizar avisos $(date -u +%F)"
          git push
